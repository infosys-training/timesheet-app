name: "🔴 P1 — Critical Incident"
description: "Complete service outage or data loss affecting all users. Requires immediate response."
title: "[P1] "
labels: ["incident", "P1-critical"]
body:
  - type: markdown
    attributes:
      value: |
        ## P1 — Critical Incident
        **SLA:** Acknowledge within 15 minutes. Resolve or mitigate within 1 hour.
        Use this template when the service is fully down, data is lost/corrupted, or a security breach is confirmed.

  - type: input
    id: incident-title
    attributes:
      label: Incident Summary
      description: One-line description of the incident.
      placeholder: "e.g., Backend API returning 500 on all endpoints; database corrupted"
    validations:
      required: true

  - type: dropdown
    id: failure-mode
    attributes:
      label: Failure Mode
      description: Primary category of the failure (see RUNBOOK.md for details).
      options:
        - Database failure (SQLite)
        - API / Express server crash
        - Memory leak / OOM
        - Dependency failure
        - Authentication outage
        - Report generation failure (PDF/CSV)
        - Frontend / proxy failure
        - Docker / deployment failure
        - Security breach
        - Other
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: Who and what is affected? Include user count, revenue impact, and affected functionality.
      placeholder: |
        - **Users affected:** All users / specific tenant / percentage
        - **Functionality affected:** All API endpoints, login, report export, etc.
        - **Business impact:** Users cannot log time; billing data at risk
    validations:
      required: true

  - type: textarea
    id: timeline
    attributes:
      label: Timeline
      description: Chronological log of events. Update as the incident progresses.
      value: |
        | Time (UTC) | Event |
        |---|---|
        | YYYY-MM-DD HH:MM | Issue first detected / alert fired |
        | | Incident acknowledged |
        | | Investigation started |
        | | Root cause identified |
        | | Mitigation applied |
        | | Service restored |
    validations:
      required: true

  - type: textarea
    id: detection
    attributes:
      label: Detection
      description: How was the incident detected?
      placeholder: "e.g., Health check alert, user report, CI pipeline failure, monitoring dashboard"
    validations:
      required: true

  - type: textarea
    id: root-cause
    attributes:
      label: Root Cause
      description: What caused the incident? (Fill in during or after investigation.)
      placeholder: "e.g., SQLite database file corrupted due to unclean container shutdown"
    validations:
      required: false

  - type: textarea
    id: resolution
    attributes:
      label: Resolution & Mitigation
      description: Steps taken to resolve or mitigate the incident. Reference RUNBOOK.md sections where applicable.
      placeholder: |
        1. Restarted backend container
        2. Restored database from backup (see RUNBOOK.md §2)
        3. Verified health check passes
    validations:
      required: false

  - type: textarea
    id: action-items
    attributes:
      label: Follow-up Action Items
      description: Preventive measures to avoid recurrence.
      placeholder: |
        - [ ] Add automated database backups
        - [ ] Improve monitoring for SQLITE errors
        - [ ] Schedule postmortem
    validations:
      required: false

  - type: input
    id: incident-commander
    attributes:
      label: Incident Commander
      description: Who is leading the incident response?
      placeholder: "@username"
    validations:
      required: false
