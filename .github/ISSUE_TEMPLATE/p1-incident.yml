name: "P1 Incident - Critical"
description: "Complete service outage or data loss affecting all users"
title: "[P1] "
labels: ["incident", "P1-critical", "priority:urgent"]
body:
  - type: markdown
    attributes:
      value: |
        ## P1 Incident Report - Critical
        Use this template for **complete service outages, data loss, or security breaches** affecting all users.
        **Response SLA**: Acknowledge within 15 minutes, begin resolution immediately.

  - type: input
    id: incident-commander
    attributes:
      label: Incident Commander
      description: Who is leading the incident response?
      placeholder: "@username"
    validations:
      required: true

  - type: dropdown
    id: failure-mode
    attributes:
      label: Failure Mode
      description: Which failure mode best describes this incident? (See RUNBOOK.md)
      options:
        - "FM-1: Database Initialization Failure"
        - "FM-2: Database Corruption / Data Loss"
        - "FM-4: Disk Full"
        - "FM-10: Memory Exhaustion"
        - "FM-11: Node.js Process Crash"
        - "FM-13: Docker Health Check Failure"
        - "Security Incident"
        - "Other (describe below)"
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: Describe the user and business impact of this incident.
      placeholder: |
        - Number of users affected: All / Subset / Single user
        - Functionality impacted: All features / Specific feature
        - Data loss: Yes / No / Unknown
        - Revenue impact: Yes / No / Unknown
    validations:
      required: true

  - type: textarea
    id: symptoms
    attributes:
      label: Symptoms
      description: What symptoms are being observed?
      placeholder: |
        - Error messages seen
        - HTTP status codes returned
        - Monitoring alerts triggered
        - User reports received
    validations:
      required: true

  - type: input
    id: detection-time
    attributes:
      label: Detection Time
      description: When was the incident first detected? (UTC)
      placeholder: "YYYY-MM-DD HH:MM UTC"
    validations:
      required: true

  - type: input
    id: start-time
    attributes:
      label: Estimated Start Time
      description: When did the incident likely begin? (UTC)
      placeholder: "YYYY-MM-DD HH:MM UTC"
    validations:
      required: true

  - type: textarea
    id: timeline
    attributes:
      label: Timeline
      description: Chronological timeline of events and actions taken.
      value: |
        | Time (UTC) | Event |
        |---|---|
        | HH:MM | Incident detected |
        | HH:MM | Investigation started |
        | HH:MM | Root cause identified |
        | HH:MM | Fix applied |
        | HH:MM | Service restored |
    validations:
      required: true

  - type: textarea
    id: root-cause
    attributes:
      label: Root Cause
      description: What caused the incident? (Fill in during or after resolution.)
      placeholder: "Describe the underlying root cause."
    validations:
      required: false

  - type: textarea
    id: resolution
    attributes:
      label: Resolution
      description: Steps taken to resolve the incident.
      placeholder: |
        1. Step taken to mitigate
        2. Step taken to resolve
        3. Verification performed
    validations:
      required: false

  - type: textarea
    id: prevention
    attributes:
      label: Prevention / Follow-up Actions
      description: What actions will prevent recurrence?
      placeholder: |
        - [ ] Action item 1
        - [ ] Action item 2
        - [ ] Update monitoring/alerting
        - [ ] Update RUNBOOK.md
    validations:
      required: false

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Production
        - Staging
        - Development
    validations:
      required: true

  - type: input
    id: related-prs
    attributes:
      label: Related PRs / Commits
      description: Link any related pull requests or commits.
      placeholder: "#123, abc1234"
    validations:
      required: false
