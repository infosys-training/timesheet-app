name: "P2 - High Severity Incident"
description: "Major feature unavailable or significant performance degradation (1 hour SLA)"
title: "[P2] "
labels: ["incident", "P2-high"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        ## P2 High Severity Incident Report
        **Response SLA: 1 hour**
        **Escalation: On-call -> Engineering Lead**

        Use this template for:
        - Major feature completely unavailable (e.g., all exports failing)
        - Performance degradation affecting all users
        - Authentication system failures
        - Partial data loss (recoverable)

  - type: input
    id: incident-title
    attributes:
      label: Incident Title
      description: Brief, descriptive title of the incident
      placeholder: "e.g., PDF/CSV export failing for all users"
    validations:
      required: true

  - type: textarea
    id: impact-description
    attributes:
      label: Impact Description
      description: Describe the scope and severity of impact on users and business operations
      placeholder: |
        - Number of affected users: {percentage or estimate}
        - Affected feature(s): {specific feature or service}
        - Workaround available: {yes/no - describe if yes}
        - Business impact: {delayed reports, degraded experience, etc.}
      value: |
        **Affected Users:** 
        **Affected Feature(s):** 
        **Workaround Available:** 
        **Business Impact:** 
    validations:
      required: true

  - type: textarea
    id: incident-timeline
    attributes:
      label: Incident Timeline
      description: Chronological record of the incident
      placeholder: |
        - YYYY-MM-DD HH:MM UTC - Issue detected
        - YYYY-MM-DD HH:MM UTC - Investigation started
        - YYYY-MM-DD HH:MM UTC - Root cause identified
        - YYYY-MM-DD HH:MM UTC - Fix deployed
      value: |
        | Time (UTC) | Event |
        |------------|-------|
        |  | Issue detected |
        |  | Investigation started |
        |  | |
    validations:
      required: true

  - type: dropdown
    id: incident-status
    attributes:
      label: Current Status
      options:
        - Investigating
        - Identified
        - Mitigating
        - Monitoring
        - Resolved
    validations:
      required: true

  - type: dropdown
    id: affected-feature
    attributes:
      label: Primary Affected Feature
      options:
        - Authentication / Login
        - Client Management
        - Work Entry Management
        - Report Generation
        - PDF Export
        - CSV Export
        - Frontend UI
        - API Performance
        - Database
        - Other
    validations:
      required: true

  - type: textarea
    id: root-cause
    attributes:
      label: Root Cause
      description: Technical root cause of the incident
      placeholder: "Describe the technical root cause, or 'Under investigation' if not yet identified"

  - type: textarea
    id: resolution-steps
    attributes:
      label: Resolution Steps
      description: Steps taken or planned to resolve the incident
      placeholder: |
        1. {Diagnostic action}
        2. {Mitigation applied}
        3. {Permanent fix}
        4. {Verification}
      value: |
        ### Diagnosis
        1. 

        ### Mitigation
        1. 

        ### Permanent Fix
        1. 

        ### Verification
        1. 
    validations:
      required: true

  - type: textarea
    id: environment-info
    attributes:
      label: Environment Information
      description: Relevant environment details
      value: |
        - **Node.js Version:** 
        - **Environment:** (development / staging / production)
        - **Docker:** (yes/no, image tag)
        - **Last Deploy:** (date/time of last deployment)

  - type: textarea
    id: logs-evidence
    attributes:
      label: Logs / Evidence
      description: Relevant log entries, error messages, or screenshots
      placeholder: "Paste relevant log entries, curl output, or attach screenshots"
      render: shell

  - type: textarea
    id: follow-up
    attributes:
      label: Follow-up Actions
      description: Actions needed after resolution
      value: |
        - [ ] Root cause documented
        - [ ] Monitoring improved
        - [ ] Runbook updated
        - [ ] Regression test added
