name: "P2 — High Severity Incident"
description: "Major feature degraded or significant subset of users affected. Response SLA: 30 minutes."
title: "[P2] "
labels: ["incident", "P2-high"]
body:
  - type: markdown
    attributes:
      value: |
        ## P2 — High Severity Incident Report
        **Response SLA: 30 minutes | Resolution Target: 4 hours**

        Use this template for:
        - Major feature unavailable (e.g., exports broken, authentication degraded)
        - Significant performance degradation (>2x normal latency)
        - High error rate (>5% of requests failing)
        - Partial data loss or data integrity concerns

  - type: input
    id: detected_at
    attributes:
      label: "Detection Time"
      description: "When was the incident first detected? (ISO 8601 format)"
      placeholder: "2024-01-15T14:30:00Z"
    validations:
      required: true

  - type: dropdown
    id: detection_method
    attributes:
      label: "Detection Method"
      options:
        - Automated monitoring alert
        - User report
        - On-call engineer observation
        - CI/CD pipeline failure
        - Other
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: "Impact Assessment"
      description: "Describe the scope and severity of impact."
      placeholder: |
        - Feature(s) affected:
        - Number/percentage of users impacted:
        - Workaround available (yes/no):
        - Business impact:
    validations:
      required: true

  - type: dropdown
    id: failure_mode
    attributes:
      label: "Failure Mode"
      description: "Select the primary failure category (see RUNBOOK.md)."
      options:
        - "FM-1: Database Failure"
        - "FM-2: API / HTTP Errors"
        - "FM-3: Authentication & JWT Failure"
        - "FM-4: Memory Leak / Resource Exhaustion"
        - "FM-5: Dependency / Build Failure"
        - "FM-6: Rate Limiting / DoS"
        - "FM-7: PDF/CSV Export Failure"
        - "FM-8: Frontend Build Failure"
        - "FM-9: Process Crash / Restart Loop"
        - "Unknown / Multiple"
    validations:
      required: true

  - type: textarea
    id: symptoms
    attributes:
      label: "Symptoms"
      description: "What observable symptoms are present?"
      placeholder: |
        - Affected endpoint(s):
        - Error messages:
        - Performance metrics:
        - User-reported behavior:
    validations:
      required: true

  - type: textarea
    id: timeline
    attributes:
      label: "Incident Timeline"
      description: "Chronological log of events and actions."
      value: |
        | Time (UTC) | Event |
        |-----------|-------|
        |           | Incident detected |
        |           | On-call acknowledged |
        |           | Investigation started |
        |           | Root cause identified |
        |           | Mitigation applied |
        |           | Service restored |
    validations:
      required: true

  - type: textarea
    id: root_cause
    attributes:
      label: "Root Cause"
      description: "What caused the incident?"
      placeholder: "e.g., Memory leak in PDF generation caused OOM after 200+ concurrent exports."

  - type: textarea
    id: resolution
    attributes:
      label: "Resolution & Mitigation"
      description: "What was done to resolve the incident?"
      placeholder: |
        Immediate actions taken:
        -
        Long-term fixes planned:
        -

  - type: textarea
    id: follow_up
    attributes:
      label: "Follow-Up Actions"
      description: "Post-incident tasks to prevent recurrence."
      placeholder: |
        - [ ] Update monitoring thresholds
        - [ ] Implement fix in code
        - [ ] Add regression test
        - [ ] Update RUNBOOK.md

  - type: input
    id: incident_commander
    attributes:
      label: "Incident Commander"
      description: "Who is leading the incident response?"
      placeholder: "@username"
    validations:
      required: true
