name: "P1 — Critical Incident"
description: "Complete service outage or data loss affecting all users. Response SLA: 15 minutes."
title: "[P1] "
labels: ["incident", "P1-critical"]
body:
  - type: markdown
    attributes:
      value: |
        ## P1 — Critical Incident Report
        **Response SLA: 15 minutes | Resolution Target: 1 hour**

        Use this template for:
        - Complete service outage (health endpoint down)
        - Data loss or corruption
        - Security breach or active exploit
        - All users unable to log in or access the application

  - type: input
    id: detected_at
    attributes:
      label: "Detection Time"
      description: "When was the incident first detected? (ISO 8601 format)"
      placeholder: "2024-01-15T14:30:00Z"
    validations:
      required: true

  - type: dropdown
    id: detection_method
    attributes:
      label: "Detection Method"
      options:
        - Automated monitoring alert
        - User report
        - On-call engineer observation
        - CI/CD pipeline failure
        - Other
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: "Impact Assessment"
      description: "Describe the impact on users, data, and business operations."
      placeholder: |
        - Number of users affected:
        - Services impacted:
        - Data at risk:
        - Revenue/business impact:
    validations:
      required: true

  - type: dropdown
    id: failure_mode
    attributes:
      label: "Failure Mode"
      description: "Select the primary failure category (see RUNBOOK.md)."
      options:
        - "FM-1: Database Failure"
        - "FM-2: API / HTTP Errors"
        - "FM-3: Authentication & JWT Failure"
        - "FM-4: Memory Leak / Resource Exhaustion"
        - "FM-5: Dependency / Build Failure"
        - "FM-6: Rate Limiting / DoS"
        - "FM-7: PDF/CSV Export Failure"
        - "FM-8: Frontend Build Failure"
        - "FM-9: Process Crash / Restart Loop"
        - "Unknown / Multiple"
    validations:
      required: true

  - type: textarea
    id: symptoms
    attributes:
      label: "Symptoms"
      description: "What observable symptoms are present?"
      placeholder: |
        - Health check response:
        - Error messages in logs:
        - HTTP status codes observed:
        - User-reported behavior:
    validations:
      required: true

  - type: textarea
    id: timeline
    attributes:
      label: "Incident Timeline"
      description: "Chronological log of events, actions taken, and status updates."
      value: |
        | Time (UTC) | Event |
        |-----------|-------|
        |           | Incident detected |
        |           | On-call acknowledged |
        |           | Investigation started |
        |           | Root cause identified |
        |           | Mitigation applied |
        |           | Service restored |
    validations:
      required: true

  - type: textarea
    id: root_cause
    attributes:
      label: "Root Cause"
      description: "What caused the incident? (Fill in during or after investigation)"
      placeholder: "e.g., Process crashed due to OOM kill; in-memory database lost all data on restart."

  - type: textarea
    id: resolution
    attributes:
      label: "Resolution & Mitigation"
      description: "What was done to resolve the incident?"
      placeholder: |
        Immediate actions taken:
        - 
        Long-term fixes planned:
        - 

  - type: textarea
    id: follow_up
    attributes:
      label: "Follow-Up Actions"
      description: "Post-incident tasks to prevent recurrence."
      placeholder: |
        - [ ] Schedule post-mortem meeting
        - [ ] Update monitoring/alerting
        - [ ] Create preventive code changes
        - [ ] Update RUNBOOK.md with lessons learned

  - type: input
    id: incident_commander
    attributes:
      label: "Incident Commander"
      description: "Who is leading the incident response?"
      placeholder: "@username"
    validations:
      required: true
