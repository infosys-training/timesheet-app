name: "P1 — Critical Incident"
description: "Service completely down or data loss. All users affected. 15-min response SLA."
labels: ["incident", "P1-critical"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        ## P1 Critical Incident Report
        **Response SLA:** 15 minutes · **Update cadence:** Every 30 minutes
        > Refer to the [RUNBOOK.md](../../RUNBOOK.md) for step-by-step resolution procedures.

  - type: input
    id: title_summary
    attributes:
      label: Incident Summary
      description: One-line description of the incident.
      placeholder: "e.g., Backend process crashed — /health returning connection refused"
    validations:
      required: true

  - type: dropdown
    id: failure_mode
    attributes:
      label: Failure Mode
      description: Which failure mode best describes this incident?
      options:
        - "FM-1: Application Crash / Process Exit"
        - "FM-2: Database Failure (SQLite)"
        - "FM-3: Data Loss on Restart (In-Memory DB)"
        - "FM-4: API 5xx Errors"
        - "FM-5: Authentication Failures"
        - "FM-6: Rate Limiting Blocking Legitimate Users"
        - "FM-7: Memory Leak / OOM Kill"
        - "FM-8: PDF/CSV Export Failures"
        - "FM-9: CORS / Proxy Misconfiguration"
        - "FM-10: Disk Space Exhaustion"
        - "FM-11: Docker Container Health Check Failures"
        - "FM-12: Dependency Vulnerability (npm)"
        - "Other / Unknown"
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: Describe the blast radius — how many users, which features, revenue/data impact.
      placeholder: |
        - **Users affected:** All / subset (estimated count)
        - **Features impacted:** Login, time entry, reports, exports
        - **Data impact:** Data loss? Corruption?
        - **Business impact:** Payroll deadline missed, etc.
    validations:
      required: true

  - type: textarea
    id: timeline
    attributes:
      label: Timeline
      description: Key timestamps (detection, investigation, mitigation, resolution). Update as the incident progresses.
      placeholder: |
        | Time (UTC)         | Event                              |
        |--------------------|------------------------------------|
        | 2026-06-16 14:00   | Alert fired — health check failing |
        | 2026-06-16 14:05   | On-call engineer acknowledged      |
        | 2026-06-16 14:15   | Root cause identified              |
        | 2026-06-16 14:20   | Service restored                   |
    validations:
      required: true

  - type: textarea
    id: root_cause
    attributes:
      label: Root Cause
      description: What caused the incident? (Fill in once identified.)
      placeholder: "e.g., In-memory SQLite DB lost all data after container restart triggered by OOM kill."
    validations:
      required: false

  - type: textarea
    id: mitigation
    attributes:
      label: Mitigation / Resolution Steps
      description: What was done to restore service?
      placeholder: |
        1. Restarted the Docker container
        2. Verified /health returned 200
        3. Confirmed users could log in and access data
    validations:
      required: false

  - type: textarea
    id: action_items
    attributes:
      label: Follow-up Action Items
      description: Preventive measures to avoid recurrence.
      placeholder: |
        - [ ] Switch to file-based SQLite with persistent volume
        - [ ] Add memory limits to Docker container
        - [ ] Set up automated DB backups
    validations:
      required: false

  - type: textarea
    id: evidence
    attributes:
      label: Evidence / Logs
      description: Attach relevant logs, screenshots, monitoring graphs, or error messages.
      placeholder: "Paste logs or link to monitoring dashboards."
    validations:
      required: false
