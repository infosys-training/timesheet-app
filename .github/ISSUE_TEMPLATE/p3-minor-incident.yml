name: "P3 — Minor Incident"
description: "Non-critical bug or issue with a workaround available."
title: "[P3] "
labels: ["incident", "P3-minor"]
body:
  - type: markdown
    attributes:
      value: |
        ## P3 — Minor Incident
        Use this template for **non-critical bugs** where a workaround exists and core functionality is not blocked. Expected response time: **< 4 hours**.

  - type: input
    id: detected_at
    attributes:
      label: Detection Time
      description: "When was the incident first detected? (UTC)"
      placeholder: "YYYY-MM-DD HH:MM UTC"
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Production
        - Staging
        - Development
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      options:
        - Backend API (Express)
        - Frontend (React/Vite)
        - Database (SQLite)
        - Authentication
        - Report Generation (CSV/PDF)
        - Docker / Infrastructure
        - CI/CD Pipeline
        - Multiple / Unknown
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: "Who is affected and what is the workaround?"
      placeholder: |
        - Client deletion returns 500 when client has >100 work entries
        - Workaround: delete work entries first, then delete client
        - ~5 users may encounter this
    validations:
      required: true

  - type: textarea
    id: symptoms
    attributes:
      label: Symptoms
      description: "What is being observed?"
      placeholder: |
        - DELETE /api/clients/42 returns 500
        - Logs: "SQLITE_CONSTRAINT: FOREIGN KEY constraint failed"
    validations:
      required: true

  - type: textarea
    id: timeline
    attributes:
      label: Timeline
      description: "Key events."
      placeholder: |
        - HH:MM UTC — Bug reported via support channel
        - HH:MM UTC — Reproduced locally
        - HH:MM UTC — Fix PR opened
    validations:
      required: true

  - type: textarea
    id: resolution
    attributes:
      label: Resolution
      description: "What was done to fix the issue?"
    validations:
      required: false

  - type: textarea
    id: root_cause
    attributes:
      label: Root Cause
      description: "What caused the issue?"
    validations:
      required: false

  - type: textarea
    id: action_items
    attributes:
      label: Follow-Up Action Items
      description: "Any improvements to prevent recurrence."
      placeholder: |
        - [ ] Add cascade delete for client work entries
        - [ ] Add integration test for client deletion with entries
    validations:
      required: false

  - type: input
    id: resolved_at
    attributes:
      label: Resolution Time
      description: "When was the issue resolved? (UTC)"
      placeholder: "YYYY-MM-DD HH:MM UTC"
    validations:
      required: false
