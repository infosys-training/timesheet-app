name: "P3 - Minor Incident"
description: "Non-critical feature impacted with a workaround available. Response SLA: 4 hr acknowledge, 24 hr mitigate."
title: "[P3] "
labels: ["incident", "P3-minor"]
body:
  - type: markdown
    attributes:
      value: |
        ## P3 Minor Incident Report
        **Use this template when a non-critical feature is impacted and a workaround exists.**
        Response SLA: 4 hr acknowledge, 24 hr mitigate.

  - type: input
    id: reporter
    attributes:
      label: Reporter
      description: Who is reporting this incident?
      placeholder: "@username or name"
    validations:
      required: true

  - type: input
    id: detected_at
    attributes:
      label: Detection Time
      description: When was the incident first detected? (UTC)
      placeholder: "YYYY-MM-DD HH:MM UTC"
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      description: Which part of the system is affected?
      multiple: true
      options:
        - Backend API (Express)
        - Frontend (React/Vite)
        - Database (SQLite)
        - Authentication
        - Docker / Infrastructure
        - Exports (PDF/CSV)
        - Other
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: What is the user-facing impact? How many users are affected?
      placeholder: |
        - Client edit form occasionally fails validation on valid input
        - Refreshing the page resolves the issue
        - Low impact; ~5 users reported
    validations:
      required: true

  - type: textarea
    id: symptoms
    attributes:
      label: Symptoms / Error Details
      description: What errors or symptoms are being observed?
      placeholder: |
        - PUT /api/clients/5 returns 400 "Validation error" for valid payloads
        - Only happens when description field contains special characters
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: Workaround
      description: What workaround is available for affected users?
      placeholder: "Remove special characters from the description field, or use the API directly."
    validations:
      required: true

  - type: textarea
    id: resolution
    attributes:
      label: Resolution / Root Cause
      description: Final root cause and permanent fix (fill in after resolution).
    validations:
      required: false

  - type: input
    id: runbook_ref
    attributes:
      label: Runbook Reference
      description: Which RUNBOOK.md section was followed?
      placeholder: "INC-03: Authentication Failures"
    validations:
      required: false

  - type: checkboxes
    id: post_incident
    attributes:
      label: Post-Incident Checklist
      options:
        - label: Fix deployed and verified
        - label: Users notified if applicable
