name: "P2 Incident - Major"
description: "Major feature unavailable or significant degradation affecting most users. Response within 1 hour."
title: "[P2] "
labels: ["incident", "P2-major"]
body:
  - type: markdown
    attributes:
      value: |
        ## P2 Incident Report
        **Response SLA: < 1 hour**
        A P2 incident is a major feature outage or significant degradation affecting most users. Notify the on-call engineer.

  - type: input
    id: reporter
    attributes:
      label: Reporter
      description: Name of the person reporting the incident.
      placeholder: "e.g., Jane Doe"
    validations:
      required: true

  - type: input
    id: detection-time
    attributes:
      label: Detection Time
      description: When was the incident first detected? (UTC)
      placeholder: "YYYY-MM-DD HH:MM UTC"
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Incident Summary
      description: Brief description of what is happening.
      placeholder: "PDF export is returning 500 errors for all clients..."
    validations:
      required: true

  - type: dropdown
    id: failure-mode
    attributes:
      label: Failure Mode
      description: Primary category of the failure (see RUNBOOK.md).
      options:
        - Database Failure
        - API / Express Server Crash
        - Memory Leak / Resource Exhaustion
        - Dependency / Build Failure
        - Authentication Failure
        - Frontend / Proxy Failure
        - Rate Limiting / DoS
        - Export (PDF/CSV) Failure
        - Unknown / Other
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Impact Assessment
      description: |
        Describe the impact:
        - Which feature(s) are affected?
        - How many users are impacted?
        - Is there a workaround?
      placeholder: |
        - PDF/CSV export is broken for all users
        - Users can still view reports in-app as a workaround
        - No data loss
    validations:
      required: true

  - type: textarea
    id: timeline
    attributes:
      label: Incident Timeline
      description: Chronological record of events. Update as the incident progresses.
      value: |
        - HH:MM UTC - Incident detected
        - HH:MM UTC -
    validations:
      required: true

  - type: textarea
    id: root-cause
    attributes:
      label: Root Cause Analysis
      description: What caused the incident? (Fill in after investigation)
    validations:
      required: false

  - type: textarea
    id: resolution
    attributes:
      label: Resolution Steps
      description: What was done to resolve the incident? Reference RUNBOOK.md procedures where applicable.
    validations:
      required: false

  - type: textarea
    id: follow-up
    attributes:
      label: Follow-up Actions
      description: Post-incident improvements to prevent recurrence.
      placeholder: |
        - [ ] Action item 1
        - [ ] Action item 2
    validations:
      required: false
