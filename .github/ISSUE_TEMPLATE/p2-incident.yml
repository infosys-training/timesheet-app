name: "P2 Incident - Major / Partial Outage"
description: "Major feature degraded or partial outage affecting many users (SLA: 30 min)"
title: "[P2] "
labels: ["incident", "P2-major"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        ## P2 Incident Report - Major
        **Response SLA: 30 minutes** | **Resolution target: 4 hours**
        Use this template for major feature degradation or partial outages.
        Refer to the [RUNBOOK.md](../../RUNBOOK.md) for response procedures.

  - type: input
    id: incident-title
    attributes:
      label: Incident Title
      description: Brief, descriptive title of the incident
      placeholder: "e.g., Authentication failing for all users - login returns 500"
    validations:
      required: true

  - type: dropdown
    id: failure-mode
    attributes:
      label: Failure Mode Category
      description: Primary failure mode (see RUNBOOK.md for details)
      options:
        - Database - Lock Contention / Performance
        - API - Multiple Routes Failing
        - API - Rate Limiting Blocking Legitimate Users
        - Authentication / Authorization Failure
        - Frontend - Proxy / Connection Failure
        - Dependency - Build / Install Failure
        - Docker - Container Health Check Failing
        - Other (describe below)
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Impact Assessment
      description: Describe the scope and severity of user impact
      value: |
        **Affected users:** [estimated count or percentage]
        **Affected features:** [list specific features]
        **Workaround available:** [yes - describe / no]
        **Data integrity:** [intact / at risk / unknown]
    validations:
      required: true

  - type: textarea
    id: timeline
    attributes:
      label: Incident Timeline
      description: Record all key events with timestamps (UTC)
      value: |
        | Time (UTC) | Event |
        |------------|-------|
        | YYYY-MM-DD HH:MM | Issue first reported / detected |
        | YYYY-MM-DD HH:MM | Investigation started |
        | YYYY-MM-DD HH:MM | Root cause identified |
        | YYYY-MM-DD HH:MM | Fix applied |
        | YYYY-MM-DD HH:MM | Verified resolved |
    validations:
      required: true

  - type: textarea
    id: symptoms
    attributes:
      label: Symptoms Observed
      description: What symptoms were observed? Include error messages, HTTP status codes, affected endpoints.
      placeholder: |
        - POST /api/auth/login returning 500
        - Frontend showing "Network Error" on login page
        - Morgan access logs showing spike in 5xx responses
    validations:
      required: true

  - type: textarea
    id: root-cause
    attributes:
      label: Root Cause
      description: What was the root cause? (Fill in during or after resolution)
      placeholder: "Describe the underlying technical cause"
    validations:
      required: false

  - type: textarea
    id: resolution
    attributes:
      label: Resolution / Mitigation Steps
      description: What steps were taken to resolve the incident?
      value: |
        ### Mitigation
        - [ ] Immediate action taken

        ### Fix
        - [ ] Permanent fix applied

        ### Verification
        - [ ] Affected endpoints tested
        - [ ] Health check passing
    validations:
      required: true

  - type: textarea
    id: action-items
    attributes:
      label: Follow-Up Action Items
      description: What needs to happen to prevent recurrence?
      value: |
        - [ ] Action item (owner: @, deadline: )
        - [ ] Update RUNBOOK.md if new failure mode discovered
    validations:
      required: false

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostic Data
      description: Attach relevant logs, screenshots, metrics, or health check output
    validations:
      required: false
