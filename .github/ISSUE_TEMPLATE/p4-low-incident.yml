name: "P4 Low Incident"
description: "Report a P4 (Low) incident — cosmetic issues, minor performance degradation, or logging gaps"
title: "[P4-LOW] "
labels: ["incident", "P4", "low"]
body:
  - type: markdown
    attributes:
      value: |
        ## P4 Low Incident Report
        Use this template for low-severity incidents and improvement requests.
        Refer to [RUNBOOK.md](../../RUNBOOK.md) for context.

  - type: textarea
    id: summary
    attributes:
      label: Incident Summary
      description: Brief description of the incident
      placeholder: "e.g., Health check endpoint generating excessive log entries"
    validations:
      required: true

  - type: dropdown
    id: impact
    attributes:
      label: Impact
      description: What is the scope of this incident?
      options:
        - "Cosmetic issue"
        - "Minor performance degradation"
        - "Non-critical feature affected"
        - "Logging/monitoring gap"
    validations:
      required: false

  - type: input
    id: detection-time
    attributes:
      label: Detection Time
      description: When was the incident first detected? (ISO 8601 timestamp)
      placeholder: "2026-05-26T14:30:00Z"
    validations:
      required: false

  - type: checkboxes
    id: affected-components
    attributes:
      label: Affected Components
      description: Which components are affected?
      options:
        - label: Backend API
        - label: Frontend
        - label: Database
        - label: Docker/Infrastructure
        - label: Authentication

  - type: textarea
    id: timeline
    attributes:
      label: Timeline
      description: Chronological list of events (optional for P4)
      placeholder: |
        - HH:MM UTC — Issue noticed during routine maintenance
    validations:
      required: false

  - type: dropdown
    id: current-status
    attributes:
      label: Current Status
      description: What is the current status of this incident?
      options:
        - "Investigating"
        - "Identified"
        - "Mitigating"
        - "Resolved"
    validations:
      required: false

  - type: input
    id: user-impact-count
    attributes:
      label: User Impact Count
      description: Estimated number of affected users
      placeholder: "e.g., 0"
    validations:
      required: false

  - type: textarea
    id: resolution-steps
    attributes:
      label: Resolution Steps
      description: What was done to resolve the incident?
      placeholder: "Numbered steps taken to resolve..."
    validations:
      required: false

  - type: textarea
    id: root-cause
    attributes:
      label: Root Cause
      description: Technical root cause analysis (optional for P4)
    validations:
      required: false

  - type: textarea
    id: follow-up-actions
    attributes:
      label: Follow-up Actions
      description: Preventive measures and follow-up tasks
      placeholder: |
        - [ ] Consider adjusting log verbosity
        - [ ] Add to next sprint backlog
    validations:
      required: false
